<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yamiventas - Tienda de Zapatos</title>
    <link rel="stylesheet" href="css.css">
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Encabezado / Navegación -->
    <header class="navbar">
        <div class="logo">
            <i data-lucide="footprints"></i>
            <span>yamiventas</span>
        </div>
        
        <div class="search-bar">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Buscar zapatos...">
        </div>

        <nav class="nav-links">
            <button class="cart-btn" id="cartBtn">
                <i data-lucide="shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </nav>
    </header>

    <!-- Banner Principal -->
    <section class="hero">
        <div class="hero-content">
            <h1>Pisando con estilo en <span>yamiventas</span></h1>
            <p>Descubre la mejor colección de calzado deportivo, casual y formal con las mejores ofertas.</p>
        </div>
    </section>

    <!-- Sección de Catálogo -->
    <main class="container">
        <!-- Filtros por Categoría -->
        <div class="filter-bar">
            <button class="filter-btn active" data-category="todos">Todos</button>
            <button class="filter-btn" data-category="deportivo">Deportivos</button>
            <button class="filter-btn" data-category="casual">Casual</button>
            <button class="filter-btn" data-category="formal">Formal</button>
            <button class="filter-btn" data-category="urbano">Urbano</button>
        </div>

        <!-- Rejilla de Productos -->
        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargan dinámicamente con JavaScript -->
        </div>
    </main>

    <!-- Modal / Panel Lateral del Carrito -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3><i data-lucide="shopping-cart"></i> Tu Carrito</h3>
            <button class="close-cart-btn" id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Ítems del carrito insertados mediante JS -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalAmount">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="alert('¡Gracias por tu compra en yamiventas!')">Finalizar Compra</button>
        </div>
    </aside>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 yamiventas - Todos los derechos reservados.</p>
    </footer>

    <script src="ruiz.js"></script>
</body>
</html>
